<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web Production</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #ffffff;
            --chat-bg: #efeae2;
            --panel-bg: #ffffff;
            --border-color: #dfe1e5;
            --text-primary: #000000;
            --text-secondary: #707579;
            --accent-color: #2481cc;
            --accent-hover: #1b6ac9;
            --bubble-out: #eeffde;
            --bubble-in: #ffffff;
            --bubble-out-hover: #e2fcd6;
            --bubble-in-hover: #f5f5f5;
            --header-bg: #ffffff;
            --sidebar-hover: #f4f4f5;
            --sidebar-active: #e5ebf5;
            --shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        html.dark {
            --bg-color: #0f141a;
            --chat-bg: #0b1014;
            --panel-bg: #17212b;
            --border-color: #101921;
            --text-primary: #f5f5f5;
            --text-secondary: #879097;
            --accent-color: #2b5278;
            --accent-hover: #386795;
            --bubble-out: #2b5278;
            --bubble-in: #182533;
            --bubble-out-hover: #325f8c;
            --bubble-in-hover: #1f2f42;
            --header-bg: #17212b;
            --sidebar-hover: #202b36;
            --sidebar-active: #2b5278;
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        #app {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Sidebar & Chat List */
        .sidebar {
            width: 420px;
            height: 100%;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .menu-btn, .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .menu-btn:hover, .icon-btn:hover {
            background-color: var(--sidebar-hover);
        }

        .search-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-container input {
            width: 100%;
            background-color: var(--chat-bg);
            border: none;
            border-radius: 20px;
            padding: 10px 16px 10px 40px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .search-container i {
            position: absolute;
            left: 14px;
            color: var(--text-secondary);
        }

        /* Folders / Tabs */
        .folders-bar {
            display: flex;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--panel-bg);
            padding: 0 10px;
            gap: 4px;
            scrollbar-width: none;
        }
        .folders-bar::-webkit-scrollbar { display: none; }

        .folder-tab {
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .folder-tab.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        /* Chat List Items */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .chat-item {
            display: flex;
            padding: 10px 14px;
            gap: 12px;
            cursor: pointer;
            position: relative;
            transition: background 0.15s;
        }

        .chat-item:hover {
            background-color: var(--sidebar-hover);
        }

        .chat-item.active {
            background-color: var(--sidebar-active);
        }

        .avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background-color: #2b5278;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 18px;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .online-dot {
            width: 12px;
            height: 12px;
            background-color: #4cd964;
            border: 2px solid var(--panel-bg);
            border-radius: 50%;
            position: absolute;
            bottom: 2px;
            right: 2px;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .chat-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-time {
            font-size: 12px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .chat-row-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-preview {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            padding-right: 10px;
        }

        .badges {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .unread-badge {
            background-color: var(--accent-color);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        /* Main Chat Window */
        .chat-window {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
            background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            position: relative;
        }

        .chat-header {
            height: 60px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 5;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .chat-header-title {
            font-weight: 600;
            font-size: 15px;
        }

        .chat-header-status {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Messages Area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .date-divider {
            align-self: center;
            background-color: rgba(0,0,0,0.2);
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .message {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 12px;
            position: relative;
            font-size: 14px;
            line-height: 1.4;
            box-shadow: var(--shadow);
            word-break: break-word;
            animation: fadeIn 0.15s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.in {
            background-color: var(--bubble-in);
            align-self: flex-start;
            border-top-left-radius: 2px;
        }

        .message.out {
            background-color: var(--bubble-out);
            align-self: flex-end;
            border-top-right-radius: 2px;
        }

        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            float: right;
            margin-left: 8px;
            margin-top: 4px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .message-meta i {
            font-size: 12px;
        }

        /* Chat Input Area */
        .chat-input-area {
            min-height: 60px;
            background-color: var(--header-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 12px;
            position: relative;
        }

        .chat-input-area textarea {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
            resize: none;
            max-height: 120px;
            line-height: 1.4;
            padding-top: 8px;
        }

        /* Modals & Menus */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            width: 400px;
            max-width: 90%;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="menu-btn" id="main-menu-btn"><i class="fa-solid fa-bars"></i></button>
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="global-search" placeholder="Поиск">
                </div>
            </div>
            <div class="folders-bar" id="folders-bar">
                <div class="folder-tab active" data-folder="all">Все чаты</div>
                <div class="folder-tab" data-folder="personal">Личные</div>
                <div class="folder-tab" data-folder="groups">Группы</div>
                <div class="folder-tab" data-folder="channels">Каналы</div>
            </div>
            <div class="chat-list" id="chat-list">
                <!-- Дин. рендер чатов -->
            </div>
        </div>

        <!-- Chat Window -->
        <div class="chat-window" id="chat-window">
            <div class="chat-header" id="chat-header">
                <div class="chat-header-info" id="open-profile-btn">
                    <div class="avatar" id="current-chat-avatar">А</div>
                    <div>
                        <div class="chat-header-title" id="current-chat-name">Выберите чат</div>
                        <div class="chat-header-status" id="current-chat-status">онлайн</div>
                    </div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="icon-btn"><i class="fa-solid fa-phone"></i></button>
                    <button class="icon-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <button class="icon-btn" id="chat-menu-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                </div>
            </div>

            <div class="messages-container" id="messages-container">
                <div style="flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-secondary);">
                    Выберите чат, чтобы начать общение
                </div>
            </div>

            <div class="chat-input-area" id="chat-input-area" style="display:none;">
                <button class="icon-btn"><i class="fa-solid fa-paperclip"></i></button>
                <textarea id="message-input" placeholder="Сообщение" rows="1"></textarea>
                <button class="icon-btn"><i class="fa-solid fa-face-smile"></i></button>
                <button class="icon-btn" id="send-btn"><i class="fa-solid fa-microphone" id="send-icon"></i></button>
            </div>
        </div>
    </div>

    <script>
        // Production State & Database Mock
        const Store = {
            currentUser: { id: 0, name: "Вы", username: "@myaccount", phone: "+7 (999) 000-00-00", bio: "Full-stack Developer & UI Architect" },
            activeFolder: 'all',
            activeChatId: null,
            chats: [
                { id: 1, type: 'user', name: 'Александр', username: '@alex_dev', avatar: 'А', online: true, unread: 2, pinned: true, draft: '', messages: [
                    { id: 101, sender: 1, text: 'Привет! Архитектура приложения готова?', time: '12:30', status: 'read' },
                    { id: 102, sender: 0, text: 'Да, все ключевые модули развернуты.', time: '12:31', status: 'read' },
                    { id: 103, sender: 1, text: 'Отлично, давай протестируем отправку медиа.', time: '12:32', status: 'delivered' }
                ]},
                { id: 2, type: 'group', name: 'Frontend Guild', username: '@frontend_guild', avatar: 'F', online: false, unread: 0, pinned: true, draft: '', membersCount: 142, messages: [
                    { id: 201, sender: 5, text: 'Кто перешел на новые Web Components?', time: '10:15', status: 'read' }
                ]},
                { id: 3, type: 'channel', name: 'Техно Стримы', username: '@technostream', avatar: 'Т', online: false, unread: 15, pinned: false, draft: '', membersCount: 1250, messages: [
                    { id: 301, sender: 3, text: 'Вышло новое обновление стандарта ECMAScript!', time: 'Вчера', status: 'read' }
                ]}
            ]
        };

        // Render Chat List
        function renderChatList() {
            const listEl = document.getElementById('chat-list');
            listEl.innerHTML = '';

            const filteredChats = Store.chats.filter(chat => {
                if (Store.activeFolder === 'personal' && chat.type !== 'user') return false;
                if (Store.activeFolder === 'groups' && chat.type !== 'group') return false;
                if (Store.activeFolder === 'channels' && chat.type !== 'channel') return false;
                return true;
            });

            filteredChats.forEach(chat => {
                const lastMsg = chat.messages[chat.messages.length - 1] || {};
                const item = document.createElement('div');
                item.className = `chat-item ${Store.activeChatId === chat.id ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="avatar">${chat.avatar}${chat.online ? '<div class="online-dot"></div>' : ''}</div>
                    <div class="chat-info">
                        <div class="chat-row-top">
                            <span class="chat-name">${chat.name}</span>
                            <span class="chat-time">${lastMsg.time || ''}</span>
                        </div>
                        <div class="chat-row-bottom">
                            <span class="chat-preview">${lastMsg.text || 'Нет сообщений'}</span>
                            <div class="badges">
                                ${chat.unread > 0 ? `<div class="unread-badge">${chat.unread}</div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
                item.onclick = () => openChat(chat.id);
                listEl.appendChild(item);
            });
        }

        // Open Chat
        function openChat(chatId) {
            Store.activeChatId = chatId;
            const chat = Store.chats.find(c => c.id === chatId);
            if (!chat) return;

            chat.unread = 0;
            renderChatList();

            document.getElementById('current-chat-name').innerText = chat.name;
            document.getElementById('current-chat-status').innerText = chat.online ? 'в сети' : 'был(а) недавно';
            document.getElementById('current-chat-avatar').innerText = chat.avatar;
            document.getElementById('chat-input-area').style.display = 'flex';

            renderMessages(chat);
        }

        // Render Messages
        function renderMessages(chat) {
            const container = document.getElementById('messages-container');
            container.innerHTML = `<div class="date-divider">Сегодня</div>`;

            chat.messages.forEach(msg => {
                const isOut = msg.sender === Store.currentUser.id;
                const msgEl = document.createElement('div');
                msgEl.className = `message ${isOut ? 'out' : 'in'}`;
                msgEl.innerHTML = `
                    ${msg.text}
                    <div class="message-meta">
                        <span>${msg.time}</span>
                        ${isOut ? `<i class="fa-solid fa-check-double" style="color: ${msg.status === 'read' ? '#4cd964' : 'inherit'}"></i>` : ''}
                    </div>
                `;
                container.appendChild(msgEl);
            });
            container.scrollTop = container.scrollHeight;
        }

        // Send Message
        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !Store.activeChatId) return;

            const chat = Store.chats.find(c => c.id === Store.activeChatId);
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            chat.messages.push({
                id: Date.now(),
                sender: Store.currentUser.id,
                text: text,
                time: timeStr,
                status: 'delivered'
            });

            input.value = '';
            renderMessages(chat);
            renderChatList();

            // Simulate auto-reply for testing real-time interaction
            setTimeout(() => {
                chat.messages.push({
                    id: Date.now() + 1,
                    sender: chat.id,
                    text: 'Сообщение получено и обработано архитектурным ядром.',
                    time: timeStr,
                    status: 'read'
                });
                renderMessages(chat);
                renderChatList();
            }, 1500);
        }

        // Event Listeners Initialization
        document.getElementById('send-btn').onclick = sendMessage;
        document.getElementById('message-input').onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        };

        document.querySelectorAll('.folder-tab').forEach(tab => {
            tab.onclick = (e) => {
                document.querySelectorAll('.folder-tab').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                Store.activeFolder = e.target.dataset.folder;
                renderChatList();
            };
        });

        // Initial Boot
        renderChatList();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MOROF VPN</title>
<!-- Подключаем скрипт Telegram Mini Apps -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cyan:#4fd2f7;--ease:cubic-bezier(.16,1,.3,1);--font:'Unbounded','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#02050f}
body{font-family:var(--font);color:#fff;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}

/* Фон по референсу: чёрно-синий верх, бирюзовое свечение слева, голубой низ */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
radial-gradient(80% 34% at -14% 69%,rgba(90,218,245,.9),rgba(56,150,225,.4) 42%,transparent 72%),
radial-gradient(70% 22% at 50% 27%,rgba(34,70,190,.32),transparent 72%),
radial-gradient(130% 24% at 50% 106%,rgba(130,214,222,.5),transparent 70%),
linear-gradient(180deg,#02040c 0%,#040b26 30%,#0a2266 52%,#1d4f9f 70%,#2f7aa8 86%,#3f93a8 100%)}

/* Без прокрутки: JS подгоняет масштаб под высоту экрана */
.app{position:relative;z-index:1;height:100%;overflow:hidden;overscroll-behavior:none}
.app::-webkit-scrollbar{display:none}
.wrap{position:absolute;top:0;left:50%;width:min(calc(100% / var(--k,1)),520px);height:calc(100% / var(--k,1));transform:translateX(-50%) scale(var(--k,1));transform-origin:50% 0;overflow-x:clip;display:flex;flex-direction:column;justify-content:space-between;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) 18px calc(16px + env(safe-area-inset-bottom,0px))}
.middle{display:flex;flex-direction:column;gap:16px}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes glow{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes halo{0%,100%{filter:opacity(.25)}50%{filter:opacity(1)}}
@keyframes tick{from{opacity:0;transform:translateY(8px)}}
.enter{animation:rise .8s var(--ease) var(--d,0s) backwards}

/* Анимация смены раздела (направление задаёт JS) */
.swap{will-change:transform,opacity;transition:transform .55s var(--ease),opacity .45s ease}
.swap.out{opacity:0;transition:transform .21s cubic-bezier(.4,0,1,1),opacity .21s ease-in}

/* Заголовок */
.header h1{font-size:clamp(20px,6.6vw,30px);font-weight:800;line-height:1.14;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.acc{color:var(--cyan)}
.header p{margin-top:10px;font-size:12px;font-weight:600;line-height:1.3}

/* Логотип */
.logo-container{position:relative;display:flex;align-items:center;justify-content:center;flex:1 1 0;min-height:56px}
.logo-container::before{content:"";position:absolute;width:62%;max-width:240px;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgba(48,112,255,.4),transparent);animation:glow 4s ease-in-out infinite}
.logo-img{position:relative;height:min(100%,170px);width:auto;max-width:60%;object-fit:contain;filter:drop-shadow(0 16px 22px rgba(10,40,170,.55));animation:float 4s ease-in-out infinite}

/* Переключатель устройств со скользящим бегунком */
.device-toggle{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:18px;background:rgba(6,16,52,.45);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 24px rgba(0,10,50,.3)}
.device-toggle::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:14px;background:linear-gradient(180deg,#fff,#dbe9ff);box-shadow:0 6px 18px rgba(80,170,255,.4);transform:translateX(var(--shift,0%));transition:transform .5s var(--ease)}
.device-toggle[data-active="5"]{--shift:100%}
.device-btn{position:relative;z-index:1;min-width:0;padding:11px 8px;border-radius:14px;font-size:12px;font-weight:600;line-height:1.25;color:rgba(255,255,255,.68);transition:color .35s var(--ease),transform .25s var(--ease)}
.device-btn.active{color:#08174a}
.device-btn:active{transform:scale(.95)}

/* Карточки тарифов: вкладка-название слева, бейдж справа */
.plans-container{display:flex;flex-direction:column;gap:20px;padding-top:12px}
.plan-card{position:relative;display:grid;grid-template-rows:auto 1fr;min-height:86px;padding:0 18px 12px;border-radius:26px;border:1.5px solid rgba(255,255,255,.26);cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07));-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:0 14px 30px rgba(0,8,40,.35),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -16px 26px rgba(10,40,150,.16);transition:transform .35s var(--ease)}
.plan-card:active{transform:scale(.975)}
.plan-card:focus-visible{outline:2px solid #fff;outline-offset:3px}
/* Выбранное состояние — отдельные слои: гаснут медленно (.8s), зажигаются быстро (.35s) */
.plan-card::before{content:"";position:absolute;inset:-1.5px;z-index:-1;border-radius:inherit;pointer-events:none;border:1.5px solid rgba(255,255,255,.95);background:linear-gradient(180deg,rgba(16,44,138,.9),rgba(8,24,88,.94));box-shadow:0 0 0 1px rgba(255,255,255,.2),inset 0 1px 0 rgba(255,255,255,.4);opacity:0;transition:opacity .8s ease-out}
.plan-card::after{content:"";position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;box-shadow:0 0 30px 3px rgba(125,205,255,.6);opacity:0;transition:opacity .8s ease-out;animation:halo 2.4s ease-in-out infinite}
.plan-card.selected::before,.plan-card.selected::after{opacity:1;transition-duration:.35s}


.plan-title{justify-self:start;margin-left:-18px;padding:8px 24px 8px 20px;font-size:12px;font-weight:600;line-height:1.25;white-space:nowrap;border-radius:24px 0 18px 0;background:rgba(3,12,48,.34);border-right:1px solid rgba(255,255,255,.2);border-bottom:1px solid rgba(255,255,255,.2)}
.badge{position:absolute;right:-1.5px;top:-14px;z-index:2;padding:7px 14px 9px;border-radius:16px 16px 0 0;font-size:10px;font-weight:700;line-height:1.2;white-space:nowrap;color:#06185a;box-shadow:0 -4px 16px rgba(120,195,255,.3)}
.badge-best{background:linear-gradient(180deg,#fff,#e6efff)}
.badge-popular{background:linear-gradient(180deg,#7be3ff,#4cc6f4)}

/* Цены живут в своей строке: ни заголовок, ни бейдж на них не налезают */
.plan-body{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px;min-width:0}
.plan-price-total{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 9px;min-width:0;font-size:17px;font-weight:700;line-height:1.15}
.old-price{font-size:11px;font-weight:500;color:rgba(255,255,255,.56);text-decoration:line-through;text-decoration-thickness:1.5px}
.plan-price-monthly{flex:none;text-align:right;line-height:1.1}
.price-monthly-val{font-size:18px;font-weight:700;white-space:nowrap}
.price-monthly-label{margin-top:3px;font-size:13px;font-weight:700;white-space:nowrap}

/* Нижняя панель */
.bottom-panel{margin-top:2px}
.cancel-text{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:-24px;padding:11px 12px 32px;border-radius:24px 24px 0 0;border:1px solid rgba(255,255,255,.14);border-bottom:0;background:linear-gradient(180deg,rgba(10,30,72,.72),rgba(22,58,98,.55));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:11px;font-weight:400;line-height:1.3;text-align:center;color:rgba(255,255,255,.92)}
.cancel-text svg{flex:none;width:16px;height:16px;fill:var(--cyan)}
.pay-btn{position:relative;z-index:1;display:block;width:100%;min-height:58px;padding:16px 18px;border-radius:22px;font-size:clamp(14px,4.4vw,17px);font-weight:700;line-height:1.2;color:#10308f;background:linear-gradient(180deg,#fff,#eaf2ff);box-shadow:0 14px 30px rgba(0,20,90,.38),inset 0 -2px 0 rgba(110,150,255,.25);transition:transform .25s var(--ease),box-shadow .25s var(--ease),filter .25s}
.pay-btn:active{transform:scale(.965);filter:brightness(.94);box-shadow:0 6px 16px rgba(0,20,90,.3),inset 0 -2px 0 rgba(110,150,255,.25)}
#pay-label{display:inline-block}
.tick{animation:tick .4s var(--ease)}

/* Экраны: «тарифы», «способы оплаты», «успех», «подписки» переключаются по data-view */
.stage{position:relative;display:flex;flex-direction:column}
.screen{pointer-events:none;transition:transform .46s cubic-bezier(.7,0,.3,1),opacity .34s ease-in,visibility 0s linear .46s}
.screen-main{display:flex;flex-direction:column;gap:14px}
.screen-pay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:14px;opacity:0;visibility:hidden;transform:translate3d(110%,0,0)}
.stage[data-view="pay"] .screen-main,.stage[data-view="done"] .screen-main,.stage[data-view="done"] .screen-pay,.stage[data-view="subs"] .screen-main,.stage[data-view="subs"] .screen-pay,.stage[data-view="subs"] .screen-done{opacity:0;visibility:hidden;transform:translate3d(-110%,0,0)}
.stage[data-view="pay"] .screen-pay,.stage[data-view="main"] .screen-main,.stage[data-view="done"] .screen-done,.stage[data-view="subs"] .screen-subs{opacity:1;visibility:visible;transform:none;transition:transform .6s cubic-bezier(.16,1,.3,1) .3s,opacity .45s ease-out .3s,visibility 0s linear .3s}
.stage[data-view="main"] .screen-subs,.stage[data-view="pay"] .screen-subs,.stage[data-view="done"] .screen-subs{opacity:0;visibility:hidden;transform:translate3d(110%,0,0)}
.stage:not(.busy)[data-view="main"] .screen-main,.stage:not(.busy)[data-view="pay"] .screen-pay,.stage:not(.busy)[data-view="subs"] .screen-subs{pointer-events:auto}
.stage.busy .screen{will-change:transform,opacity}

/* Экран оплаты: плашка с логотипами платёжных систем и кнопка «Оплатить» */
.pay-mid{flex:1 1 auto;display:flex;align-items:center;min-width:0}
.pay-panel{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:76px;padding:18px 20px;border-radius:26px;background:linear-gradient(180deg,#fff,#eef4ff);box-shadow:0 0 0 2px rgba(79,210,247,.95),0 0 26px rgba(79,210,247,.35),0 14px 30px rgba(0,20,90,.38);transition:transform .45s var(--ease),box-shadow .45s var(--ease),filter .3s}
.pay-panel:active{transform:scale(.965);filter:brightness(.96);box-shadow:0 0 0 2px rgba(79,210,247,.95),0 0 12px rgba(79,210,247,.25),0 6px 14px rgba(0,20,90,.3)}
.pay-panel::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid rgba(79,210,247,.85);opacity:0;pointer-events:none}
.pay-panel.tapped::after{animation:ring .65s ease-out}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.05,1.3)}}
.pay-panel:focus-visible,.back-btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.pay-logos{display:block;width:min(100%,260px);height:auto;pointer-events:none}
.back-btn{align-self:flex-start;display:grid;place-items:center;width:44px;height:44px;margin-top:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);background:rgba(6,16,52,.45);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 8px 20px rgba(0,10,50,.3),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .25s var(--ease),background .3s}
.back-btn svg{width:20px;height:20px}
.back-btn:active{transform:scale(.92);background:rgba(6,16,52,.7)}
@media (hover:hover){.back-btn:hover{background:rgba(6,16,52,.62)}}

/* Экран успеха: контур и галочка «рисуются» штрихом */
.screen-done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;opacity:0;visibility:hidden;transform:translate3d(110%,0,0)}
.done-check{width:min(120px,26vh);height:auto;color:var(--cyan);filter:drop-shadow(0 0 16px rgba(79,210,247,.5))}
.dc-ring{stroke-dasharray:330;stroke-dashoffset:330;transition:stroke-dashoffset .2s ease}
.dc-tick{stroke-dasharray:72;stroke-dashoffset:72;transition:stroke-dashoffset .2s ease}
.stage[data-view="done"] .dc-ring{stroke-dashoffset:0;transition:stroke-dashoffset .85s cubic-bezier(.65,0,.35,1) .62s}
.stage[data-view="done"] .dc-tick{stroke-dashoffset:0;transition:stroke-dashoffset .5s cubic-bezier(.65,0,.35,1) 1.3s}
.stage[data-view="done"] .done-check{animation:pop .5s ease 1.6s}
@keyframes pop{50%{transform:scale(1.08)}}
.done-text{max-width:92%;font-size:clamp(17px,5.4vw,22px);font-weight:800;line-height:1.2;letter-spacing:-.01em;opacity:0;transform:translate3d(0,12px,0);transition:opacity .25s ease,transform .25s ease}
.stage[data-view="done"] .done-text{opacity:1;transform:none;transition:opacity .6s ease-out 1.45s,transform .7s var(--ease) 1.45s}

@media (max-height:700px){
  .plan-card{min-height:76px}
  .header h1{font-size:clamp(20px,6.1vw,26px)}
}
@media (max-width:350px){
  .plan-card{padding:0 14px 10px}
  .plan-title{font-size:11px;margin-left:-14px;padding:7px 18px 7px 16px}
  .badge{font-size:9px;padding:6px 10px 8px}
  .plan-price-total{font-size:15px}
  .price-monthly-val{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important}
}

/* ============================================================
   ЭКРАН «МОИ ПОДПИСКИ» (ДОБАВЛЕНО)
   ============================================================ */

/* Экран «Мои подписки» */
.screen-subs{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;opacity:0;visibility:hidden;transform:translate3d(110%,0,0)}

/* Кнопка «+» в правом верхнем углу */
.add-btn{
  position:absolute;
  top:4px;
  right:4px;
  z-index:5;
  display:grid;
  place-items:center;
  width:48px;
  height:48px;
  border-radius:50%;
  background:linear-gradient(180deg,#fff,#eaf2ff);
  color:#10308f;
  box-shadow:0 10px 24px rgba(0,20,90,.35),inset 0 -2px 0 rgba(110,150,255,.25),0 0 0 2px rgba(79,210,247,.5);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease),filter .25s;
}
.add-btn svg{width:26px;height:26px}
.add-btn:active{transform:scale(.9);filter:brightness(.95)}
@media (hover:hover){.add-btn:hover{box-shadow:0 12px 28px rgba(0,20,90,.45),inset 0 -2px 0 rgba(110,150,255,.25),0 0 0 2px rgba(79,210,247,.8)}}

/* Заголовок и счётчик */
.subs-header{padding:8px 60px 0 4px}
.subs-title{font-size:clamp(20px,6vw,26px);font-weight:800;line-height:1.15;letter-spacing:-.02em;color:#fff}
.subs-subtitle{margin-top:6px;font-size:12px;font-weight:600;color:rgba(255,255,255,.72)}

/* Список карточек — со скроллом */
.subs-list{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:4px 0 8px;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.subs-list::-webkit-scrollbar{width:0}

/* Карточка подписки — свёрнутое состояние */
.sub-card{
  position:relative;
  display:flex;
  flex-direction:column;
  padding:18px 20px;
  border-radius:24px;
  border:1.5px solid rgba(255,255,255,.26);
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07));
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 14px 30px rgba(0,8,40,.35),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -16px 26px rgba(10,40,150,.16);
  cursor:pointer;
  transition:transform .35s var(--ease);
}
.sub-card:active{transform:scale(.985)}
.sub-card.expired{opacity:.7;border-color:rgba(255,120,120,.5)}

/* Верхняя строка: номер + статус-индикатор */
.sub-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sub-num{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em}
.sub-status{flex:none;width:10px;height:10px;border-radius:50%;background:#4fd2f7;box-shadow:0 0 10px rgba(79,210,247,.8)}
.sub-status.expired{background:#ff7676;box-shadow:0 0 10px rgba(255,118,118,.7)}

/* Дата окончания мелким шрифтом */
.sub-date{margin-top:6px;font-size:11.5px;font-weight:500;color:rgba(255,255,255,.68)}

/* Раскрытое содержимое карточки */
.sub-details{
  max-height:0;
  overflow:hidden;
  opacity:0;
  transition:max-height .45s var(--ease),opacity .3s ease-out,margin-top .3s var(--ease);
}
.sub-card.expanded .sub-details{max-height:600px;opacity:1;margin-top:14px}
.sub-details-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12.5px;line-height:1.35}
.sub-details-key{color:rgba(255,255,255,.6);font-weight:500}
.sub-details-val{color:#fff;font-weight:600;text-align:right;word-break:break-all}
.sub-key{
  margin-top:10px;
  padding:10px 12px;
  border-radius:14px;
  background:rgba(3,12,48,.45);
  border:1px solid rgba(255,255,255,.14);
  font-family:'Inter',monospace;
  font-size:10.5px;
  line-height:1.4;
  color:#a8e6ff;
  word-break:break-all;
  -webkit-user-select:text;
  user-select:text;
}
.sub-key-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:10px;margin-bottom:4px}

/* Пустое состояние (когда подписок нет) */
.subs-empty{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:14px;
  padding:40px 20px;
  color:rgba(255,255,255,.72);
}
.subs-empty-icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(79,210,247,.15);color:var(--cyan)}
.subs-empty-text{font-size:13px;font-weight:500;line-height:1.4}
</style>
</head>
<body>
<div class="bg"></div>

<main class="app"><div class="wrap">

    <!-- Заголовок -->
    <div class="header enter">
        <h1><span class="acc">VPN</span> после которого вы забудете о <span class="acc">любых ограничениях!</span></h1>
        <p class="swap" id="subtitle-devices">Все тарифы = 2 устройства.</p>
    </div>

    <!-- Логотип -->
    <div class="logo-container enter" style="--d:.1s">
        <img src="logo.PNG" alt="MOROF VPN Logo" class="logo-img">
    </div>

    <div class="stage" id="stage" data-view="main"><div class="screen screen-main" id="screen-main">
    <div class="middle">
        <!-- Переключатель устройств -->
        <div class="device-toggle enter" style="--d:.2s" data-active="2" role="group">
            <button type="button" class="device-btn active" onclick="changeDevices(2)" id="btn-dev-2">2 устройства</button>
            <button type="button" class="device-btn" onclick="changeDevices(5)" id="btn-dev-5">5 устройств</button>
        </div>

        <!-- Карточки тарифов -->
        <div class="plans-container">
            <!-- 12 месяцев -->
            <div class="plan-slot swap enter" style="--d:.3s">
                <div class="plan-card selected" onclick="selectPlan(12, 'plan-12')" id="plan-12" role="button" tabindex="0">
                    <div class="badge badge-best">Лучший выбор</div>
                    <div class="plan-title">12 месяцев</div>
                    <div class="plan-body">
                        <div class="plan-price-total">
                            <span class="old-price" id="old-price-12">2989₽</span>
                            <span id="total-price-12">1590₽</span>
                        </div>
                        <div class="plan-price-monthly">
                            <div class="price-monthly-val" id="monthly-price-12">132₽/</div>
                            <div class="price-monthly-label">месяц</div>
                        </div>
                    </div>
                </div>
            </div>

        <button type="button" class="pay-btn" id="confirm-btn" onclick="confirmPay()"><span id="confirm-label">Оплатить 1590 ₽</span></button>
    </div>

    <!-- Экран успеха -->
    <div class="screen screen-done" id="screen-done">
        <svg class="done-check" viewBox="0 0 120 120" fill="none" aria-hidden="true">
            <circle cx="60" cy="60" r="52" stroke="currentColor" stroke-opacity=".16" stroke-width="5"/>
            <circle class="dc-ring" cx="60" cy="60" r="52" stroke="currentColor" stroke-width="5" stroke-linecap="round" transform="rotate(-90 60 60)"/>
            <path class="dc-tick" d="M38 62l16 16 30-34" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="done-text">Подписка успешно оплачена</div>
    </div>

    <!-- Экран «Мои подписки» (ДОБАВЛЕНО) -->
    <div class="screen screen-subs" id="screen-subs">
        <button type="button" class="add-btn" id="add-btn" onclick="goToPlans()" aria-label="Купить ещё">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
        </button>
        <div class="subs-header">
            <h2 class="subs-title">Мои подписки</h2>
            <p class="subs-subtitle" id="subs-count">Загрузка...</p>
        </div>
        <div class="subs-list" id="subs-list"></div>
    </div>
</div></div></main>

<script>
    const tg = (window.Telegram && window.Telegram.WebApp) || null;
    const tgSupports = v => { try { return !!tg && typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast(v); } catch (e) { return false; } };

    try {
        if (tg) {
            tg.expand();
            tg.ready();
            if (tgSupports('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes();
            if (tg.onEvent) tg.onEvent('viewportChanged', () => fitToScreen());
            if (tgSupports('6.1')) {
                tg.setHeaderColor('#02050f');
                tg.setBackgroundColor('#02050f');
            }
        }
    } catch (e) {}

    const pricing = {
        2: {
            1: { total: 199, monthly: 199, old: null },
            3: { total: 499, monthly: 166, old: 747 },
            12: { total: 1590, monthly: 132, old: 2989 }
        },
        5: {
            1: { total: 259, monthly: 259, old: null },
            3: { total: 649, monthly: 216, old: 897 },
            12: { total: 2090, monthly: 174, old: 3589 }
        }
    };

    let currentDevices = 2;
    let currentPeriod = 12;
    let swapTimer = 0;

    const $ = id => document.getElementById(id);
    const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

    // Тактильная отдача: Telegram HapticFeedback -> vibrate (если есть) -> тишина без ошибок
    // kind: 'light' | 'medium' | 'heavy' | 'soft' | 'rigid' | 'select'
    function hapticFeedback(kind = 'light') {
        try {
            if (tgSupports('6.1') && tg.HapticFeedback) {
                if (kind === 'select') tg.HapticFeedback.selectionChanged();
                else if (kind === 'success') tg.HapticFeedback.notificationOccurred('success');
                else tg.HapticFeedback.impactOccurred(kind);
                return;
            }
            if (typeof navigator.vibrate === 'function') navigator.vibrate(kind === 'medium' || kind === 'heavy' ? 18 : 9);
        } catch (e) {}
    }

    function syncToggle() {
        $('btn-dev-2').classList.toggle('active', currentDevices === 2);
        $('btn-dev-5').classList.toggle('active', currentDevices === 5);
        document.querySelector('.device-toggle').dataset.active = String(currentDevices);
    }

    // Направленная смена раздела: dir = 1 (вперёд) — старый блок уходит вниз, новый приходит сверху;
    // dir = -1 (назад) — наоборот. Любое новое нажатие плавно перехватывает текущую анимацию.
    function swapSection(dir) {
        clearTimeout(swapTimer);
        if (reduceMotion) { render(); return; }
        const els = Array.from(document.querySelectorAll('.swap'));
        els.forEach(el => {
            el.style.transitionDelay = '0ms';
            el.classList.add('out');
            el.style.transform = `translate3d(0,${dir * 24}px,0)`;
        });
        swapTimer = setTimeout(() => {
            render();
            els.forEach(el => {
                el.style.transition = 'none';
                el.style.transform = `translate3d(0,${-dir * 24}px,0)`;
            });
            void document.body.offsetWidth; // зафиксировать стартовую позицию без анимации
            els.forEach((el, i) => {
                el.style.transition = '';
                el.style.transitionDelay = (i * 45) + 'ms';
                el.classList.remove('out');
                el.style.transform = 'translate3d(0,0,0)';
            });
        }, 220);
    }

    function changeDevices(count) {
        if (count === currentDevices) { hapticFeedback('light'); return; }
        hapticFeedback('select');
        const dir = count > currentDevices ? 1 : -1;
        currentDevices = count;
        syncToggle();
        swapSection(dir);
    }

    function selectPlan(period, elementId) {
        hapticFeedback('light');
        currentPeriod = period;

        document.querySelectorAll('.plan-card').forEach(el => el.classList.toggle('selected', el.id === elementId));

        updateButton();
    }

    function render() {
        $('subtitle-devices').innerText = `Все тарифы = ${currentDevices} устройства.`;
        updatePrices();
    }

    function updatePrices() {
        const prices = pricing[currentDevices];

        $('total-price-12').innerText = prices[12].total + '₽';
        $('monthly-price-12').innerText = prices[12].monthly + '₽/';
        $('old-price-12').innerText = prices[12].old ? prices[12].old + '₽' : '';

        $('total-price-3').innerText = prices[3].total + '₽';
        $('monthly-price-3').innerText = prices[3].monthly + '₽/';
        $('old-price-3').innerText = prices[3].old ? prices[3].old + '₽' : '';

        $('total-price-1').innerText = prices[1].total + '₽';
        $('monthly-price-1').innerText = prices[1].monthly + '₽/';

        updateButton();
    }

    function updateButton() {
        const price = pricing[currentDevices][currentPeriod].total;
        const label = $('pay-label');
        const text = `Оплатить ${price} ₽`;
        const confirmLabel = $('confirm-label');
        if (confirmLabel) confirmLabel.textContent = text;
        if (label.textContent !== text) {
            label.textContent = text;
            label.classList.remove('tick');
            void label.offsetWidth;
            label.classList.add('tick');
        }
    }

    // --- Смена экранов: тарифы -> оплата -> успех -> подписки (переходы описаны в CSS по data-view) ---
    let view = 'main', viewTimer = 0, sending = false;
    const stage = $('stage');

    function setView(next) {
        view = next;
        clearTimeout(viewTimer);
        stage.classList.add('busy'); // пока идёт переход, кнопки неактивны
        stage.dataset.view = next;
        viewTimer = setTimeout(() => stage.classList.remove('busy'), reduceMotion ? 60 : 950);
        try {
            if (tgSupports('6.1') && tg.BackButton) { if (next === 'pay' || next === 'subs') tg.BackButton.show(); else tg.BackButton.hide(); }
        } catch (e) {}
    }

    function pay() { // «Оплатить» на главном экране: открывает экран оплаты
        if (view !== 'main') return;
        hapticFeedback('light');
        setView('pay');
    }

    function goBack() { // возврат: с экрана оплаты — на тарифы; с подписок — на тарифы
        if (sending) return;
        hapticFeedback('light');
        if (view === 'pay') {
            setView('main');
        } else if (view === 'subs') {
            setView('main');
        }
    }

    function pressPanel() { // плашка с логотипами: мягкое нажатие + круг-отклик
        hapticFeedback('light');
        const panel = $('pay-panel');
        panel.classList.remove('tapped');
        void panel.offsetWidth;
        panel.classList.add('tapped');
    }

    async function confirmPay() { // «Оплатить»: экран успеха -> покупка через API -> экран «Мои подписки»
        if (view !== 'pay' || sending) return;
        sending = true;
        hapticFeedback('light');
        setView('done');
        setTimeout(() => hapticFeedback('success'), reduceMotion ? 0 : 1350);

        try {
            const res = await fetch(API_BUY, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    initData: tg ? tg.initData : '',
                    devices: currentDevices,
                    period: currentPeriod
                })
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            if (data && data.subscription) {
                userSubs.push(data.subscription);
                userSubs.sort((a, b) => (a.number || 0) - (b.number || 0));
                renderSubsList(userSubs);
            }
        } catch (e) {
            console.error('[buy] failed:', e);
        }

        setTimeout(() => {
            sending = false;
            setView('subs');
        }, reduceMotion ? 900 : 2600);
    }

    try { if (tgSupports('6.1') && tg.BackButton) tg.BackButton.onClick(goBack); } catch (e) {}
    document.addEventListener('keydown', e => { if (e.key === 'Escape') goBack(); });
    document.addEventListener('touchstart', () => {}, { passive: true }); // включает :active на iOS

    // Клавиатура: Enter / Пробел на карточке тарифа
    document.addEventListener('keydown', e => {
        if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('plan-card')) {
            e.preventDefault();
            e.target.click();
        }
    });

    updatePrices();

    // Без прокрутки: если контент не помещается по высоте, весь интерфейс равномерно уменьшается
    function fitToScreen() {
        const wrap = document.querySelector('.wrap');
        const last = document.querySelector('.stage');
        const pad = parseFloat(getComputedStyle(wrap).paddingBottom) || 0;
        const overflow = () => last.offsetTop + last.offsetHeight + pad > wrap.clientHeight + 0.5;
        let k = 1;
        wrap.style.setProperty('--k', k);
        for (let i = 0; i < 30 && k > 0.5 && overflow(); i++) {
            k = Math.max(0.5, k - 0.02);
            wrap.style.setProperty('--k', k.toFixed(3));
        }
    }
    window.addEventListener('resize', fitToScreen);
    window.addEventListener('orientationchange', fitToScreen);
    window.addEventListener('load', fitToScreen);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitToScreen);
    fitToScreen();

    // ============================================
    // ИНТЕГРАЦИЯ С SUPABASE (через /api/ на сервере)
    // ============================================

    const API_SUBS = '/api/my-subscriptions';
    const API_BUY  = '/api/buy-subscription';

    let userSubs = []; // кэш подписок текущего пользователя

    // Форматирует дату "08.11.2027 15:30:00" -> "08.11.2027"
    function formatDate(iso) {
        if (!iso || typeof iso !== 'string') return '—';
        return iso.split(' ')[0] || iso;
    }

    // Проверяет, активна ли подписка по дате
    function isActive(expiresAt) {
        if (!expiresAt) return false;
        try {
            const parts = expiresAt.split(' ')[0].split('.');
            if (parts.length !== 3) return true;
            const [d, m, y] = parts.map(Number);
            const dt = new Date(y, m - 1, d, 23, 59, 59);
            return dt.getTime() >= Date.now();
        } catch (e) { return true; }
    }

    // Строит HTML одной карточки подписки
    function buildSubCard(sub) {
        const num = sub.number ?? '—';
        const devices = sub.devices ?? '—';
        const period = sub.period ?? '—';
        const expires = formatDate(sub.expires_at);
        const key = (sub.key || '').trim();
        const active = isActive(sub.expires_at);

        const card = document.createElement('div');
        card.className = 'sub-card' + (active ? '' : ' expired');
        card.dataset.num = String(num);

        card.innerHTML = `
            <div class="sub-row">
                <span class="sub-num">Подписка #${num}</span>
                <span class="sub-status${active ? '' : ' expired'}"></span>
            </div>
            <div class="sub-date">до ${expires}</div>
            <div class="sub-details">
                <div class="sub-details-row"><span class="sub-details-key">Статус</span><span class="sub-details-val">${active ? 'Активна ✓' : 'Истекла ✕'}</span></div>
                <div class="sub-details-row"><span class="sub-details-key">Устройств</span><span class="sub-details-val">${devices}</span></div>
                <div class="sub-details-row"><span class="sub-details-key">Период</span><span class="sub-details-val">${period} мес.</span></div>
                <div class="sub-details-row"><span class="sub-details-key">Действует до</span><span class="sub-details-val">${expires} (МСК)</span></div>
                ${key ? `<div class="sub-key-label">VLESS-ключ</div><div class="sub-key" id="key-${num}">${key}</div>` : ''}
            </div>
        `;

        card.addEventListener('click', () => {
            card.classList.toggle('expanded');
            if (typeof hapticFeedback === 'function') hapticFeedback('light');
        });

        return card;
    }

    // Рендерит список подписок
    function renderSubsList(subs) {
        const list = $('subs-list');
        const countEl = $('subs-count');
        list.innerHTML = '';

        if (!subs || !subs.length) {
            countEl.textContent = 'У вас пока нет подписок';
            const empty = document.createElement('div');
            empty.className = 'subs-empty';
            empty.innerHTML = `
                <div class="subs-empty-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="subs-empty-text">Нажмите «+» в правом верхнем углу,<br>чтобы оформить первую подписку</div>
            `;
            list.appendChild(empty);
            return;
        }

        const activeCount = subs.filter(s => isActive(s.expires_at)).length;
        countEl.textContent = `${subs.length} ${subs.length === 1 ? 'подписка' : subs.length < 5 ? 'подписки' : 'подписок'} · активных: ${activeCount}`;

        subs.forEach(s => list.appendChild(buildSubCard(s)));
    }

    // Загружает подписки с сервера
    async function loadSubscriptions() {
        if (!tg || !tg.initData) {
            userSubs = [];
            renderSubsList([]);
            return;
        }
        try {
            const res = await fetch(`${API_SUBS}?initData=${encodeURIComponent(tg.initData)}`);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            userSubs = Array.isArray(data.subscriptions) ? data.subscriptions : [];
            userSubs.sort((a, b) => (a.number || 0) - (b.number || 0));
            renderSubsList(userSubs);
        } catch (e) {
            console.error('[subs] load failed:', e);
            userSubs = [];
            renderSubsList([]);
        }
    }

    // Кнопка «+» — переход на тарифы
    function goToPlans() {
        if (typeof hapticFeedback === 'function') hapticFeedback('light');
        setView('main');
    }

    // При старте приложения — если подписки есть, открыть экран «Мои подписки»
    async function initApp() {
        await loadSubscriptions();
        if (userSubs && userSubs.length > 0) {
            setView('subs');
        }
    }

    initApp();
</script>
</body>
</html>

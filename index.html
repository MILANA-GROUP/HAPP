<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOROF VPN</title>
    <!-- Подключаем скрипт Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- БАЗОВЫЕ СТИЛИ И ШРИФТЫ --- */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Запрещаем скролл */
        }

        body {
            /* Градиент от черного к темно-синему и светло-голубому */
            background: linear-gradient(180deg, #000000 0%, #0a192f 40%, #0066ff 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Распределяем контент равномерно */
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
        }

        /* --- АНИМАЦИИ --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0px) drop-shadow(0 15px 25px rgba(6, 182, 212, 0.3)); }
            50% { transform: translateY(-8px) drop-shadow(0 25px 35px rgba(6, 182, 212, 0.6)); }
            100% { transform: translateY(0px) drop-shadow(0 15px 25px rgba(6, 182, 212, 0.3)); }
        }

        /* Анимация свечения и затухания обводки */
        @keyframes pulseBorder {
            0% { 
                border-color: #60a5fa; 
                box-shadow: 0 0 10px rgba(59, 130, 246, 0.8), inset 0 0 15px rgba(59, 130, 246, 0.3); 
            }
            100% { 
                border-color: #3b82f6; 
                box-shadow: 0 0 25px rgba(59, 130, 246, 0), inset 0 0 5px rgba(59, 130, 246, 0); 
            }
        }

        /* --- ВЕРХНЯЯ ЧАСТЬ (ЗАГОЛОВКИ) --- */
        .header {
            text-align: center;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .header h1 {
            font-size: 24px; /* Уменьшили, чтобы влезло */
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        
        .header h1 span {
            color: #60a5fa; /* Светло-синий акцент */
        }

        .header p {
            font-size: 13px;
            color: #a1a1aa;
            font-weight: 600;
        }

        /* --- ЛОГОТИП (КАРТИНКА) --- */
        .logo-container {
            display: flex;
            justify-content: center;
            margin: 5px 0;
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        .logo-img {
            width: 150px; /* Уменьшили, чтобы не было скролла */
            height: auto;
            object-fit: contain;
            animation: float 4s ease-in-out infinite;
        }

        /* --- ПЕРЕКЛЮЧАТЕЛЬ УСТРОЙСТВ --- */
        .device-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 4px;
            margin: 10px 0 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .device-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #a1a1aa;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .device-btn.active {
            background: rgba(59, 130, 246, 0.3);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            border: 1px solid rgba(59, 130, 246, 0.5);
        }

        /* --- КАРТОЧКИ ТАРИФОВ --- */
        .plans-container {
            display: flex;
            flex-direction: column;
            gap: 10px; /* Уменьшили отступы между карточками */
        }

        .plan-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 14px 18px; /* Уменьшили внутренние отступы */
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        #plan-12 { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; }
        #plan-3 { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }
        #plan-1 { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards; }

        .plan-card:active {
            transform: scale(0.97);
        }

        /* ТО САМОЕ СВЕЧЕНИЕ И ЗАТУХАНИЕ */
        .plan-card.selected {
            border: 2px solid #3b82f6;
            background: rgba(59, 130, 246, 0.15);
            animation: pulseBorder 1.5s infinite alternate ease-in-out; /* Пульсация */
        }

        .badge {
            position: absolute;
            top: 0;
            right: 0;
            padding: 5px 12px;
            font-size: 10px;
            font-weight: 700;
            border-bottom-left-radius: 12px;
            box-shadow: -2px 2px 10px rgba(0,0,0,0.2);
        }

        .badge-best {
            background: #ffffff;
            color: #000000;
        }

        .badge-popular {
            background: #06b6d4;
            color: #ffffff;
        }

        .plan-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .plan-title {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .plan-price-total {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
        }

        .old-price {
            font-size: 13px;
            color: #71717a;
            text-decoration: line-through;
            font-weight: 400;
        }

        .plan-price-monthly {
            text-align: right;
        }

        .price-monthly-val {
            font-size: 20px;
            font-weight: 800;
        }

        .price-monthly-label {
            font-size: 11px;
            color: #a1a1aa;
        }

        /* --- НИЖНЯЯ ПАНЕЛЬ С КНОПКОЙ --- */
        .bottom-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        }

        .cancel-text {
            text-align: center;
            font-size: 12px;
            color: #d4d4d8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .cancel-text svg {
            width: 14px;
            height: 14px;
            fill: #06b6d4;
        }

        .pay-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 17px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .pay-btn:active {
            background: #e2e8f0;
            transform: scale(0.96);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- Заголовок -->
    <div class="header">
        <h1>VPN после которого<br>вы забудете о <span>любых ограничениях!</span></h1>
        <p id="subtitle-devices">Все тарифы = 2 устройства.</p>
    </div>

    <!-- Логотип -->
    <div class="logo-container">
        <img src="logo.PNG" alt="MOROF VPN Logo" class="logo-img">
    </div>

    <!-- Переключатель устройств -->
    <div class="device-toggle">
        <div class="device-btn active" onclick="changeDevices(2)" id="btn-dev-2">2 устройства</div>
        <div class="device-btn" onclick="changeDevices(5)" id="btn-dev-5">5 устройств</div>
    </div>

    <!-- Карточки тарифов -->
    <div class="plans-container">
        <!-- 12 месяцев -->
        <div class="plan-card selected" onclick="selectPlan(12, 'plan-12')" id="plan-12">
            <div class="badge badge-best">Лучший выбор</div>
            <div class="plan-info">
                <div class="plan-title">12 месяцев</div>
                <div class="plan-price-total">
                    <span class="old-price" id="old-price-12">2989₽</span>
                    <span id="total-price-12">1590₽</span>
                </div>
            </div>
            <div class="plan-price-monthly">
                <div class="price-monthly-val" id="monthly-price-12">132₽/</div>
                <div class="price-monthly-label">месяц</div>
            </div>
        </div>

        <!-- 3 месяца -->
        <div class="plan-card" onclick="selectPlan(3, 'plan-3')" id="plan-3">
            <div class="badge badge-popular">Популярный</div>
            <div class="plan-info">
                <div class="plan-title">3 месяца</div>
                <div class="plan-price-total">
                    <span class="old-price" id="old-price-3">747₽</span>
                    <span id="total-price-3">499₽</span>
                </div>
            </div>
            <div class="plan-price-monthly">
                <div class="price-monthly-val" id="monthly-price-3">166₽/</div>
                <div class="price-monthly-label">месяц</div>
            </div>
        </div>

        <!-- 1 месяц -->
        <div class="plan-card" onclick="selectPlan(1, 'plan-1')" id="plan-1">
            <div class="plan-info">
                <div class="plan-title">1 месяц</div>
                <div class="plan-price-total">
                    <span id="total-price-1">199₽</span>
                </div>
            </div>
            <div class="plan-price-monthly">
                <div class="price-monthly-val" id="monthly-price-1">199₽/</div>
                <div class="price-monthly-label">месяц</div>
            </div>
        </div>
    </div>

    <!-- Нижняя панель с кнопкой -->
    <div class="bottom-panel">
        <div class="cancel-text">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            Можно отменить в любое время
        </div>
        <button class="pay-btn" onclick="pay()" id="main-pay-btn">Оплатить 1590 ₽</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');

        const pricing = {
            2: {
                1: { total: 199, monthly: 199, old: null },
                3: { total: 499, monthly: 166, old: 747 },
                12: { total: 1590, monthly: 132, old: 2989 }
            },
            5: {
                1: { total: 259, monthly: 259, old: null },
                3: { total: 649, monthly: 216, old: 897 },
                12: { total: 2090, monthly: 174, old: 3589 }
            }
        };

        let currentDevices = 2;
        let currentPeriod = 12;

        function hapticFeedback(type = 'light') {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred(type);
            }
        }

        function changeDevices(count) {
            hapticFeedback('light');
            currentDevices = count;
            
            document.getElementById('btn-dev-2').classList.remove('active');
            document.getElementById('btn-dev-5').classList.remove('active');
            document.getElementById(`btn-dev-${count}`).classList.add('active');
            
            document.getElementById('subtitle-devices').innerText = `Все тарифы = ${count} устройства.`;

            updatePrices();
        }

        function selectPlan(period, elementId) {
            hapticFeedback('light');
            currentPeriod = period;
            
            document.querySelectorAll('.plan-card').forEach(el => el.classList.remove('selected'));
            document.getElementById(elementId).classList.add('selected');
            
            updateButton();
        }

        function updatePrices() {
            const prices = pricing[currentDevices];
            
            document.getElementById('total-price-12').innerText = prices[12].total + '₽';
            document.getElementById('monthly-price-12').innerText = prices[12].monthly + '₽/';
            document.getElementById('old-price-12').innerText = prices[12].old ? prices[12].old + '₽' : '';

            document.getElementById('total-price-3').innerText = prices[3].total + '₽';
            document.getElementById('monthly-price-3').innerText = prices[3].monthly + '₽/';
            document.getElementById('old-price-3').innerText = prices[3].old ? prices[3].old + '₽' : '';

            document.getElementById('total-price-1').innerText = prices[1].total + '₽';
            document.getElementById('monthly-price-1').innerText = prices[1].monthly + '₽/';
            
            updateButton();
        }

        function updateButton() {
            const price = pricing[currentDevices][currentPeriod].total;
            document.getElementById('main-pay-btn').innerText = `Оплатить ${price} ₽`;
        }

        function pay() {
            hapticFeedback('heavy');
            
            const data = {
                action: "buy_subscription",
                devices: currentDevices,
                period: currentPeriod,
                price: pricing[currentDevices][currentPeriod].total
            };

            tg.sendData(JSON.stringify(data));
        }

        updatePrices();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOROF VPN</title>
    <!-- Подключаем скрипт Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- БАЗОВЫЕ СТИЛИ И ШРИФТЫ --- */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Темный градиентный фон */
            background: radial-gradient(circle at 50% 0%, #1c2b4a 0%, #090d16 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: 140px; /* Место для нижней кнопки */
        }

        /* --- АНИМАЦИИ --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0px) drop-shadow(0 20px 30px rgba(6, 182, 212, 0.4)); }
            50% { transform: translateY(-10px) drop-shadow(0 30px 40px rgba(6, 182, 212, 0.6)); }
            100% { transform: translateY(0px) drop-shadow(0 20px 30px rgba(6, 182, 212, 0.4)); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
            50% { box-shadow: 0 0 30px rgba(59, 130, 246, 0.5); }
            100% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        }

        /* --- ВЕРХНЯЯ ЧАСТЬ (ЗАГОЛОВКИ) --- */
        .header {
            padding: 30px 20px 10px;
            text-align: left;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .header h1 {
            font-size: 34px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }
        
        .header h1 span {
            color: #3b82f6; /* Синий акцент */
        }

        .header p {
            font-size: 14px;
            color: #a1a1aa;
            font-weight: 600;
        }

        /* --- ЛОГОТИП (КАРТИНКА) --- */
        .logo-container {
            display: flex;
            justify-content: center;
            margin: 10px 0 20px; /* Уменьшили отступы, так как лого стал больше */
            opacity: 0; /* Скрыто до анимации */
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        .logo-img {
            width: 220px; /* УВЕЛИЧИЛИ РАЗМЕР ЩИТА */
            max-width: 85%; /* Защита от вылезания за края на узких экранах */
            height: auto;
            object-fit: contain;
            animation: float 4s ease-in-out infinite;
        }

        /* --- ПЕРЕКЛЮЧАТЕЛЬ УСТРОЙСТВ --- */
        .device-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 5px;
            margin: 0 20px 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .device-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #a1a1aa;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .device-btn.active {
            background: rgba(59, 130, 246, 0.2);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.5);
        }

        /* --- КАРТОЧКИ ТАРИФОВ --- */
        .plans-container {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .plan-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            opacity: 0;
            /* Плавный переход для теней и трансформаций */
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); /* Мягкая базовая тень */
        }

        /* Задержки появления для карточек */
        #plan-12 { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; }
        #plan-3 { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }
        #plan-1 { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards; }

        .plan-card:active {
            transform: scale(0.97);
        }

        .plan-card.selected {
            border: 2px solid #3b82f6;
            background: rgba(59, 130, 246, 0.15);
            animation: pulseGlow 2s infinite; /* Добавлена пульсация */
        }

        /* Плашки "Лучший выбор" и "Популярный" */
        .badge {
            position: absolute;
            top: 0;
            right: 0;
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 700;
            border-bottom-left-radius: 16px;
            box-shadow: -2px 2px 10px rgba(0,0,0,0.2);
        }

        .badge-best {
            background: #ffffff;
            color: #000000;
        }

        .badge-popular {
            background: #06b6d4;
            color: #ffffff;
        }

        .plan-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .plan-title {
            font-size: 16px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .plan-price-total {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
        }

        .old-price {
            font-size: 14px;
            color: #71717a;
            text-decoration: line-through;
            font-weight: 400;
        }

        .plan-price-monthly {
            text-align: right;
        }

        .price-monthly-val {
            font-size: 22px;
            font-weight: 800;
        }

        .price-monthly-label {
            font-size: 12px;
            color: #a1a1aa;
        }

        /* --- НИЖНЯЯ ПАНЕЛЬ С КНОПКОЙ --- */
        .bottom-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px 25px;
            background: linear-gradient(to top, #090d16 85%, transparent);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        }

        .cancel-text {
            text-align: center;
            font-size: 12px;
            color: #a1a1aa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .cancel-text svg {
            width: 14px;
            height: 14px;
            fill: #06b6d4;
        }

        .pay-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 16px;
            padding: 20px;
            font-size: 18px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            /* Мягкая тень для кнопки */
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .pay-btn:active {
            background: #e2e8f0;
            transform: scale(0.96); /* Чуть сильнее сжимается при нажатии */
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- Заголовок -->
    <div class="header">
        <h1>VPN, который<br>не придётся <span>менять.</span></h1>
        <p id="subtitle-devices">Все тарифы = 2 устройства.</p>
    </div>

    <!-- Логотип -->
    <div class="logo-container">
        <!-- Твой файл logo.PNG -->
        <img src="logo.PNG" alt="MOROF VPN Logo" class="logo-img">
    </div>

    <!-- Переключатель устройств -->
    <div class="device-toggle">
        <div class="device-btn active" onclick="changeDevices(2)" id="btn-dev-2">2 устройства</div>
        <div class="device-btn" onclick="changeDevices(5)" id="btn-dev-5">5 устройств</div>
    </div>

    <!-- Карточки тарифов -->
    <div class="plans-container">
        <!-- 12 месяцев -->
        <div class="plan-card selected" onclick="selectPlan(12, 'plan-12')" id="plan-12">
            <div class="badge badge-best">Лучший выбор</div>
            <div class="plan-info">
                <div class="plan-title">12 месяцев</div>
                <div class="plan-price-total">
                    <span class="old-price" id="old-price-12">2989₽</span>
                    <span id="total-price-12">1590₽</span>
                </div>
            </div>
            <div class="plan-price-monthly">
                <div class="price-monthly-val" id="monthly-price-12">132₽/</div>
                <div class="price-monthly-label">месяц</div>
            </div>
        </div>

        <!-- 3 месяца -->
        <div class="plan-card" onclick="selectPlan(3, 'plan-3')" id="plan-3">
            <div class="badge badge-popular">Популярный</div>
            <div class="plan-info">
                <div class="plan-title">3 месяца</div>
                <div class="plan-price-total">
                    <span class="old-price" id="old-price-3">747₽</span>
                    <span id="total-price-3">499₽</span>
                </div>
            </div>
            <div class="plan-price-monthly">
                <div class="price-monthly-val" id="monthly-price-3">166₽/</div>
                <div class="price-monthly-label">месяц</div>
            </div>
        </div>

        <!-- 1 месяц -->
        <div class="plan-card" onclick="selectPlan(1, 'plan-1')" id="plan-1">
            <div class="plan-info">
                <div class="plan-title">1 месяц</div>
                <div class="plan-price-total">
                    <span id="total-price-1">199₽</span>
                </div>
            </div>
            <div class="plan-price-monthly">
                <div class="price-monthly-val" id="monthly-price-1">199₽/</div>
                <div class="price-monthly-label">месяц</div>
            </div>
        </div>
    </div>

    <!-- Нижняя панель с кнопкой -->
    <div class="bottom-panel">
        <div class="cancel-text">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            Можно отменить в любое время
        </div>
        <button class="pay-btn" onclick="pay()" id="main-pay-btn">Оплатить 1590 ₽</button>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран
        tg.ready();

        // Настройки цветов шапки Telegram под наш темный дизайн
        tg.setHeaderColor('#090d16');
        tg.setBackgroundColor('#090d16');

        // Данные о ценах
        const pricing = {
            2: {
                1: { total: 199, monthly: 199, old: null },
                3: { total: 499, monthly: 166, old: 747 },
                12: { total: 1590, monthly: 132, old: 2989 }
            },
            5: {
                1: { total: 259, monthly: 259, old: null },
                3: { total: 649, monthly: 216, old: 897 },
                12: { total: 2090, monthly: 174, old: 3589 }
            }
        };

        // Текущее состояние
        let currentDevices = 2;
        let currentPeriod = 12;

        // Тактильный отклик (вибрация)
        function hapticFeedback(type = 'light') {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred(type);
            }
        }

        // Функция переключения устройств
        function changeDevices(count) {
            hapticFeedback('light'); // Легкая вибрация
            currentDevices = count;
            
            // Меняем активную кнопку
            document.getElementById('btn-dev-2').classList.remove('active');
            document.getElementById('btn-dev-5').classList.remove('active');
            document.getElementById(`btn-dev-${count}`).classList.add('active');
            
            // Меняем подзаголовок
            document.getElementById('subtitle-devices').innerText = `Все тарифы = ${count} устройства.`;

            // Обновляем цены на карточках
            updatePrices();
        }

        // Функция выбора тарифа
        function selectPlan(period, elementId) {
            hapticFeedback('light'); // Легкая вибрация
            currentPeriod = period;
            
            // Снимаем выделение со всех карточек
            document.querySelectorAll('.plan-card').forEach(el => el.classList.remove('selected'));
            
            // Выделяем выбранную
            document.getElementById(elementId).classList.add('selected');
            
            // Обновляем текст на большой кнопке
            updateButton();
        }

        // Обновление цифр на карточках при смене устройств
        function updatePrices() {
            const prices = pricing[currentDevices];
            
            // 12 месяцев
            document.getElementById('total-price-12').innerText = prices[12].total + '₽';
            document.getElementById('monthly-price-12').innerText = prices[12].monthly + '₽/';
            document.getElementById('old-price-12').innerText = prices[12].old ? prices[12].old + '₽' : '';

            // 3 месяца
            document.getElementById('total-price-3').innerText = prices[3].total + '₽';
            document.getElementById('monthly-price-3').innerText = prices[3].monthly + '₽/';
            document.getElementById('old-price-3').innerText = prices[3].old ? prices[3].old + '₽' : '';

            // 1 месяц
            document.getElementById('total-price-1').innerText = prices[1].total + '₽';
            document.getElementById('monthly-price-1').innerText = prices[1].monthly + '₽/';
            
            updateButton();
        }

        // Обновление текста главной кнопки
        function updateButton() {
            const price = pricing[currentDevices][currentPeriod].total;
            document.getElementById('main-pay-btn').innerText = `Оплатить ${price} ₽`;
        }

        // Обработка нажатия на кнопку "Оплатить"
        function pay() {
            hapticFeedback('heavy'); // Сильная вибрация при оплате
            
            // Отправляем данные боту (в Python через tg.sendData)
            const data = {
                action: "buy_subscription",
                devices: currentDevices,
                period: currentPeriod,
                price: pricing[currentDevices][currentPeriod].total
            };

            tg.sendData(JSON.stringify(data));
            
            // Telegram сам закроет окно при отправке данных (если настроено в боте)
        }

        // Инициализация при загрузке
        updatePrices();
    </script>
</body>
</html>
